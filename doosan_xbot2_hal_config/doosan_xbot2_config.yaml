XBotInterface:
  urdf: xacro $(ros2 pkg prefix --share doosan_urdf)/urdf/h2515.urdf.xacro gripper:=vision setup:=iit
  srdf: xacro $(ros2 pkg prefix --share doosan_srdf)/srdf/h2515.srdf.xacro gripper:=vision

ModelInterface:
  model_type: "pin"

# hal
xbotcore_device_configs:
    sim: $(ros2 pkg prefix --share doosan_xbot2_hal_config)/hal/gz.yaml
    dummy: $(ros2 pkg prefix --share doosan_xbot2_hal_config)/hal/dummy.yaml
    doosan: $(ros2 pkg prefix --share doosan_xbot2_hal_config)/hal/doosan.yaml

# threads
xbotcore_threads:
    rt_main:  {sched: fifo , prio: 99, period: 0.001}
    nrt_main: {sched: other, prio: 0 , period: 0.001}


# plugins
xbotcore_plugins:

    # Homing plugin is provided togheter with the xbot 
    # binaries but the source code is visible at 
    # https://github.com/ADVRHumanoids/xbot2_examples/tree/master/src/homing_example
    homing:
        thread: rt_main
        type: homing
        params:
            qhome: {value: [0, 0.7, 1.1, 0.0, 1.4, 0.0], type: Eigen::VectorXd}

    ros_io: {thread: nrt_main, type: ros2_io, params: {publish_tf: {type: bool, value: true}}}
    ros_control: {thread: nrt_main, type: ros2_control, params: {autostart: {type: bool, value: false}}}

    force_estimation:
      type: force_estimation
      thread: nrt_main
      params:
          name:
            value: "tcp"
            type: string
          dofs:
              value: [0, 1, 2, 3, 4, 5]
              type: vector<int>
          chains:
              value: ["arm"]
              type: vector<string>
          momentum_based:
              value: false
              type: bool
          filter_bandwith:
              value: 5.0
              type: double

    periodic_motion:
        thread: rt_main
        type: periodic_motion
        params:
           q_home_start: {value: [0, 0.5, -0.5, 0, 0, 0], type: Eigen::VectorXd}
           q_home_end:   {value: [0, -0.5, 1.0, 0.5, -1.57, -1.57], type: Eigen::VectorXd}
           time: {value: 5.0, type: double}
    
    gcomp_example:
        type: gcomp_example
        thread: rt_main
        params:
            enabled_chains: 
                value: [arm]
                type: vector<string>
            

    cartesio_imp: 
        thread: rt_main 
        type: albero_cartesio_rt
        params:
            #ctrl_override: *ctrl_override
            enabled_chains: 
                value: [arm]
                type: vector<string>
            problem_description:
                value: $(ros2 pkg prefix --share doosan_xbot2_hal_config)/doosan_impedance_config.yaml
                type: file
            solver: {value: AlberoImpedance, type: string}
            enable_feedback: {value: true, type: bool}
            fc_map: {value: {low: 0.85, high: 0.99}, type: map<double>}
            use_payload_estimator:
              value: false  # note: keep false if you care to live
              type: bool
            payload_estimator_link:
              value: link6
              type: string
            external_gravity_compensation:
              value: true  # note: keep false if you care to live
              type: bool


# global parameters
# additional parameters that don't relate to any plugin 
xbotcore_param:
    /xbot/hal/joint_safety/filter_autostart: {value: true, type: bool}
    /xbot/hal/joint_safety/filter_cutoff_hz: {value: 1.0, type: double}
    /xbot/hal/enable_safety: {value: true, type: bool}
    /xbot_internal/ros_io/call_timeout: {value: 1.0, type: chrono}
    /rt_main/memory_hooks: {value: true, type: bool}






